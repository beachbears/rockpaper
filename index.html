<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>
<body>
  <br>
  <br>
  <button id="rock">ROCK</button>
  <button id="paper">PAPER</button>
  <button id="scissors">SCISSORS</button>

  <p id="player">The player's power is:</p>
  <p id="computer">The computer's power is:</p>
   <br>
  <p id="humanScore">You: 0</p>
  <p id="computerScore">Computer: 0</p>
  
  <br>
  <p id="result">Result:</p>

  <script>

    let humanScore = 0;
    let computerScore = 0;

    const powerp = document.getElementById("player");
    const powerc = document.getElementById("computer");
    const humanscore = document.getElementById("humanScore");
    const computerscore = document.getElementById("computerScore");
    const result = document.getElementById("result");

    function getComputerChoice() {
      const choices = ['rock', 'paper', 'scissors'];
      return choices[Math.floor(Math.random() * choices.length)];
    }


    function playRound(humanChoice) {
      const computerChoice = getComputerChoice();
      powerp.textContent = "The player's power is: " + humanChoice.toUpperCase();
      powerc.textContent = "The computer's power is: " + computerChoice.toUpperCase();

      let outcome = "";

      if (humanChoice === computerChoice) {
        outcome = "It's a draw!";
      } else if (
        (humanChoice === 'rock' && computerChoice === 'scissors') ||
        (humanChoice === 'paper' && computerChoice === 'rock') ||
        (humanChoice === 'scissors' && computerChoice === 'paper')
      ) {
        humanScore++;
        outcome = "You win this round!";
      } else {
        computerScore++;
        outcome = "Computer wins this round!";
      }

      result.textContent = "Result: " + outcome;
      humanscore.textContent = "You: " + humanScore;
      computerscore.textContent = "Computer: " + computerScore;

      if (humanScore === 5) {
        result.textContent = "🎉 You won the game!";
      } else if (computerScore === 5) {
        result.textContent = "💻 Computer won the game!";
      }
      
    }

      // Add event listeners to buttons
    document.getElementById("rock").addEventListener("click", () => playRound("rock"));
    document.getElementById("paper").addEventListener("click", () => playRound("paper"));
    document.getElementById("scissors").addEventListener("click", () => playRound("scissors"));
  </script>
</body>
</html>
